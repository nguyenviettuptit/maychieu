# Đóng gói app Android (MayChieu.apk) và đăng lên mục Releases để tải về điện thoại.
name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Khóa ký app: tạo 1 lần rồi giữ trong bộ nhớ đệm của GitHub Actions (không đưa vào mã nguồn)
      # để các bản cập nhật sau cài đè lên bản cũ được.
      - name: Restore signing key
        id: keycache
        uses: actions/cache@v4
        with:
          path: ~/.maychieu-key
          key: maychieu-signing-key-v1

      - name: Create signing key (first build only)
        if: steps.keycache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.maychieu-key
          openssl rand -hex 24 > ~/.maychieu-key/pass
          keytool -genkeypair -v -storetype pkcs12 -keystore ~/.maychieu-key/maychieu.p12 \
            -alias maychieu -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass "$(cat ~/.maychieu-key/pass)" -keypass "$(cat ~/.maychieu-key/pass)" \
            -dname "CN=May Chieu Vat The"

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export KEYSTORE_PATH=~/.maychieu-key/maychieu.p12
          export KEYSTORE_PASSWORD="$(cat ~/.maychieu-key/pass)"
          echo "::add-mask::$KEYSTORE_PASSWORD"
          set -o pipefail
          gradle -p android assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|> " build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk MayChieu.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Máy Chiếu ${{ github.run_number }}
          body: |
            Tải **MayChieu.apk** bên dưới về điện thoại Android rồi mở để cài.
            Lần đầu cài, cho phép "Cài ứng dụng không rõ nguồn gốc".
          files: MayChieu.apk
          make_latest: true
